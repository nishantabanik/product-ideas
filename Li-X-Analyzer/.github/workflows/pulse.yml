# Looks at fresh posts every 15 minutes, so the app can raise an alert when a post takes off or starts slowly.
# Needs two repository secrets (Settings, Secrets and variables, Actions): APP_URL (like https://our-app.vercel.app) and CRON_SECRET (the same value as in Vercel).
name: Post pulse
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Check recent posts
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL or CRON_SECRET is not set, skipping"; exit 0; fi
          curl -fsS --max-time 55 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/pulse"
